services:
  # Backend FastAPI API Service
  - type: web
    name: careerpilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: careerpilot-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: careerpilot-api
          property: host

databases:
  - name: careerpilot-db
    databaseName: careerpilot
    user: careerpilot_user
    plan: free
